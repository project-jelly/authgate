name: Vulnerability Full Scan

on:
  workflow_dispatch:
  schedule:
    # Every Monday 10:00 KST (01:00 UTC)
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-vuln-scan:
    name: Full Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: |
          # Build govulncheck with the setup-go toolchain. Without this,
          # the tool's own toolchain directive can downgrade to Go 1.25 and
          # fail to load this Go 1.26 module.
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run full govulncheck
        id: vulnscan
        run: |
          govulncheck ./... 2>&1 | tee govulncheck-full.txt

      - name: Upload full scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: govulncheck-full-report
          path: govulncheck-full.txt

      - name: Write summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.vulnscan.outcome }}
        run: |
          {
            echo "## Full Vulnerability Scan"
            echo "- Scope: \`govulncheck ./...\`"
            echo "- Blocking: yes"
            echo "- Result: ${SCAN_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
