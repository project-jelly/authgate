name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  fmt:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: gofmt -l
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found unformatted files; run 'gofmt -w .'"
            exit 1
          fi

  sqlc:
    name: SQLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Enforce sqlc-only runtime DB access
        run: |
          if git grep -nE 'ExecContext\(|QueryRowContext\(|QueryContext\(|PrepareContext\(' -- \
            internal/storage \
            ':(exclude)internal/storage/**/storeq/**' \
            ':(exclude)**/*_test.go'; then
            echo "Direct SQL calls are not allowed in runtime storage code. Use sqlc queries in internal/db/queries and generated storeq."
            exit 1
          fi
          if git grep -nE 'parsePostgresArray|func \(a [^)]*StringArray\) (Scan|Value)\(' -- internal/storage; then
            echo "Manual postgres array parsers/scanners are not allowed. Use sqlc/driver array handling."
            exit 1
          fi

      - name: sqlc generate
        run: '"$(go env GOPATH)/bin/sqlc" generate'

      - name: Verify generated files are up to date
        run: |
          if ! git diff --exit-code -- internal/db/storeq; then
            echo "sqlc generated files are out of date. Run sqlc generate and commit results."
            exit 1
          fi

      - name: sqlc vet
        run: '"$(go env GOPATH)/bin/sqlc" vet'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Run all tests with coverage
        # -timeout 20m: the integration suite spins up testcontainers Postgres
        # and runs in ~2-3min locally, but the shared ARC runner under load can
        # exceed Go's default 10m per-package timeout and panic. 20m gives wide
        # headroom without masking a genuine hang.
        run: go test -coverprofile=coverage.out -tags=integration -timeout 20m ./internal/...

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: coverage.out

  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        # -tags=integration so the concurrency tests (refresh-token rotation
        # atomicity, device-code polling, etc. — all behind //go:build
        # integration) are actually compiled under the race detector. Without
        # the tag they were excluded, leaving the concurrency paths unchecked.
        # Same runner as the Test job, so Docker/testcontainers is available.
        # -timeout 30m: the race detector makes the integration suite several
        # times slower, so it needs a larger ceiling than the Test job's 20m to
        # avoid Go's default 10m timeout panic on the shared runner.
        run: go test -race -tags=integration -timeout 30m ./...

  coverage-report:
    name: Coverage Report
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: code-coverage
      - name: Write coverage summary
        run: |
          if [ ! -f coverage.out ]; then
            echo "No coverage artifact found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "## Coverage Report"
            echo ""
            echo "- Total coverage: ${TOTAL_COVERAGE}"
          } >> "$GITHUB_STEP_SUMMARY"

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...

  lint:
    name: GolangCI-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: |
          GOTOOLCHAIN=go$(awk '/^go / {print $2; exit}' go.mod) \
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: |
          # Build govulncheck with the setup-go toolchain. Without this,
          # the tool's own toolchain directive can downgrade to Go 1.25 and
          # fail to load this Go 1.26 module.
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          # Test and integration dependencies execute in CI and are part of the
          # repository's supply chain, so scan them together with runtime code.
          govulncheck ./...
