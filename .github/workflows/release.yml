name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      revision: ${{ steps.policy.outputs.revision }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate CI and unpublished version
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_policy.py

  build:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      packages: write
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve an existing version image for safe retry
        id: existing
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/authgate
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/release_policy.py existing
      - name: Verify existing digest belongs to this source
        if: steps.existing.outputs.digest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/authgate
          DIGEST: ${{ steps.existing.outputs.digest }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://project-jelly.github.io/attestations/release-evidence/v1 \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/existing-provenance.json"
          python3 .github/scripts/release_policy.py verify-existing "$RUNNER_TEMP/existing-provenance.json"
      - name: Build candidate once
        if: steps.existing.outputs.digest == ''
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/authgate:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}

  scan:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: ./.github/actions/scan-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/authgate@${{ needs.build.outputs.digest }}
          arch: ${{ matrix.arch }}
          category: trivy-release-${{ matrix.arch }}

  publish:
    needs: [prepare, build, scan]
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Recheck current main and unpublished version
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_policy.py
      - name: Stop superseded publication
        if: steps.policy.outputs.eligible != 'true'
        run: |
          echo 'main or the release tag changed during scanning; publication is blocked.' >&2
          exit 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record source and workflow revisions
        run: python3 .github/scripts/release_provenance.py generate "$RUNNER_TEMP/provenance.json"
      - name: Attest scanned image release evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/authgate
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          predicate-type: https://project-jelly.github.io/attestations/release-evidence/v1
          predicate-path: ${{ runner.temp }}/provenance.json
      - name: Verify release evidence for the exact scanned index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/authgate
          DIGEST: ${{ needs.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://project-jelly.github.io/attestations/release-evidence/v1 \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/verified-provenance.json"
          python3 .github/scripts/release_provenance.py verify "$RUNNER_TEMP/verified-provenance.json"
      - name: Promote scanned digest without rebuilding
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/authgate
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/release_policy.py promote
      - name: Create version tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/release_policy.py finish
