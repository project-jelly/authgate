name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Sign and publish provenance for the image digest.
      contents: write # Create the version tag and GitHub release.
      id-token: write # Exchange GitHub OIDC identity for the attestation.
      packages: write # Push the image and attestations to GHCR.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          raw_version="$(cat VERSION)"
          if [[ ! "$raw_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a stable semantic version such as 1.2.3" >&2
            exit 1
          fi
          echo "version=v${raw_version}" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! existing_revision="$(
            gh api "repos/${REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha' 2>/dev/null
          )"; then
            existing_revision=""
          fi
          if [[ -n "$existing_revision" && "$existing_revision" != "$REVISION" ]]; then
            echo "Tag ${VERSION} already points to ${existing_revision}" >&2
            exit 1
          fi
          if [[ -z "$existing_revision" ]]; then
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${VERSION}" \
              -f "sha=${REVISION}" >/dev/null
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/authgate:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/authgate:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/authgate
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
          fi

      - name: Delete old GHCR images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner_type=$(gh api "/repos/${REPOSITORY}" --jq '.owner.type')
          if [[ "$owner_type" == "Organization" ]]; then
            packages_path="/orgs/${REPOSITORY_OWNER}/packages"
          else
            packages_path="/users/${REPOSITORY_OWNER}/packages"
          fi

          mapfile -t version_ids < <(
            gh api --paginate \
              "$packages_path/container/authgate/versions?per_page=100" \
              --jq '.[] | select(((.metadata.container.tags // []) | index("latest")) | not) | .id'
          )

          versions_to_keep=20
          if (( ${#version_ids[@]} <= versions_to_keep )); then
            exit 0
          fi

          for version_id in "${version_ids[@]:versions_to_keep}"; do
            gh api --method DELETE \
              "$packages_path/container/authgate/versions/${version_id}"
          done
