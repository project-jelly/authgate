name: Image Security

on:
  schedule:
    # 03:17 Asia/Seoul.
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: image-security
  cancel-in-progress: false

permissions: {}

jobs:
  scan:
    name: Trivy (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/scan-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/authgate:latest
          arch: ${{ matrix.arch }}
          category: trivy-daily-${{ matrix.arch }}
