version: 2

# Keep routine dependency churn batched. Major bumps stay separate because
# Go, GitHub Actions, and security-sensitive auth libraries need review.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-deps:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      gh-actions:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: gomod
    directory: /examples/cli
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      example-cli-deps:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: gomod
    directory: /examples/mcp-server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      example-mcp-deps:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: gomod
    directory: /examples/webapp
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      example-webapp-deps:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /examples/webapp
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
