services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: authgate
      POSTGRES_USER: authgate
      POSTGRES_PASSWORD: authgate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authgate"]
      interval: 2s
      timeout: 5s
      retries: 10

  mock-idp:
    image: ghcr.io/cagojeiger/mock-google-oidc:v0.3.0@sha256:b4ade126f493a32f8ae10de5fbeb8a2ee617c81b51450d709b4cae5598ed9ea8
    ports:
      - "8082:8082"
    environment:
      PUBLIC_URL: http://localhost:8082

  authgate:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./clients.yaml:/etc/authgate/clients.yaml:ro
    environment:
      DATABASE_URL: postgres://authgate:authgate@db:5432/authgate?sslmode=disable
      SESSION_SECRET: "test-session-secret-32chars-long!"
      PUBLIC_URL: http://localhost:8080
      DEV_MODE: "true"
      # Local development only; production must mount a persistent signing key.
      SIGNING_KEY_PATH: /tmp/signing_key.pem
      OIDC_ISSUER_URL: http://localhost:8082
      OIDC_INTERNAL_URL: http://mock-idp:8082
      OIDC_CLIENT_ID: authgate
      OIDC_CLIENT_SECRET: fake-secret
      # PII at-rest 암호화는 필수다 (ADR-002, 평문 컬럼 제거 후). 아래는 로컬 dev 전용 더미 키.
      PII_ENC_ROOT_KEY_ID: "enc-dev-1"
      PII_ENC_ROOT_SECRET: "ISA5aviCx54GVBxSHvU8nqcYwC5JKOj5OFUj7uwzuUA="
      PII_LOOKUP_ROOT_KEY_ID: "lookup-dev-1"
      PII_LOOKUP_ROOT_SECRET: "/lXaqOM5dvoYzptzzEJ5oF3n+OyEQ/etgXmCDb5bJLI="
    depends_on:
      db:
        condition: service_healthy
      mock-idp:
        condition: service_started
    healthcheck:
      test: ["CMD", "/authgate", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: on-failure

  sample-app:
    build:
      context: ./examples/webapp
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      AUTHGATE_ISSUER: http://authgate:8080
      AUTHGATE_BROWSER_URL: http://localhost:8080
      CLIENT_ID: sample-app
      SELF_URL: http://localhost:9090
      LISTEN_ADDR: ":9090"
    depends_on:
      authgate:
        condition: service_started
    restart: on-failure
